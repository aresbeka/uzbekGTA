name: Build Uzbek Car Parking APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Kodlarni yuklab olish
        uses: actions/checkout@v4

      - name: Node.js o'rnatish
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Java 21 o'rnatish
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Kutubxonalarni o'rnatish
        run: npm install

      - name: Draco fayllarini offline uchun nusxalash
        run: |
          mkdir -p public/draco
          cp -r node_modules/three/examples/jsm/libs/draco/* public/draco/

      - name: O'yinni yig'ish (Vite build)
        run: npm run build

      - name: Android loyihani tayyorlash (Capacitor)
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: APK yasash (Gradle)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Tayyor APK ni yuklash
        uses: actions/upload-artifact@v4
        with:
          name: Uzbek-Car-Parking-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
