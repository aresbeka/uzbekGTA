<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Uzbek Mini GTA</title>
  <style>
    * {
      box-sizing: border-box; margin: 0; padding: 0;
      font-family: 'Segoe UI', system-ui, Arial, sans-serif;
      user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent;
    }
    html, body {
      width: 100%; height: 100%; overflow: hidden;
      background: #0d0d12; touch-action: none;
    }
    canvas { display: block; touch-action: none; }

    /* YUKLANISH EKRANI */
    #loadingScreen {
      position: fixed; inset: 0; z-index: 100;
      background: radial-gradient(circle at center, #1b2430 0%, #090c10 100%);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      color: #fff; transition: opacity 0.5s ease;
    }
    #loadingScreen h1 {
      font-size: 28px; font-weight: 900; letter-spacing: 2px;
      background: linear-gradient(90deg, #00e676, #40c4ff);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      margin-bottom: 10px;
    }
    #loadingText { font-size: 13px; color: rgba(255,255,255,0.75); margin-bottom: 16px; }
    .load-bar {
      width: 210px; height: 6px; border-radius: 99px;
      background: rgba(255,255,255,0.12); overflow: hidden;
    }
    #loadFill {
      width: 15%; height: 100%;
      background: linear-gradient(90deg, #00e676, #40c4ff);
      transition: width 0.25s ease;
    }

    /* SHAFFOF GLASS EFFEKTI */
    .glass {
      background: rgba(0, 0, 0, 0.26);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      border: 1.5px solid rgba(255, 255, 255, 0.24);
      color: #fff;
    }

    /* TEPADAGI HUD (VERTIKALGA MOS) */
    #topHUD {
      position: fixed; top: max(10px, env(safe-area-inset-top)); left: 10px; right: 10px;
      display: flex; justify-content: space-between; align-items: flex-start;
      pointer-events: none; z-index: 20;
    }

    /* GTA MINI-XARITA (RADAR) */
    #radarWrap {
      display: flex; flex-direction: column; gap: 5px; pointer-events: auto;
    }
    #minimap {
      width: 94px; height: 94px; border-radius: 16px;
      background: rgba(0, 0, 0, 0.38);
      border: 2px solid rgba(255, 255, 255, 0.35);
      box-shadow: 0 4px 14px rgba(0,0,0,0.35);
    }
    .hp-bar {
      width: 94px; height: 7px; border-radius: 6px;
      background: rgba(0,0,0,0.45); overflow: hidden;
      border: 1px solid rgba(255,255,255,0.22);
    }
    .hp-fill { width: 100%; height: 100%; background: linear-gradient(90deg, #00e676, #69f0ae); }

    /* O'NG TEPADA STATUS VA GARAJ TUGMASI */
    .right-top {
      display: flex; flex-direction: column; align-items: flex-end; gap: 6px; pointer-events: auto;
    }
    .stats-box {
      padding: 6px 12px; border-radius: 14px; text-align: right;
    }
    .money { color: #00e676; font-size: 19px; font-weight: 900; text-shadow: 0 1px 6px rgba(0,0,0,0.6); }
    .stars { color: #ffd54f; font-size: 13px; letter-spacing: 2px; }
    .speed-mini { color: #40c4ff; font-size: 14px; font-weight: 800; margin-top: 2px; display: none; }

    .top-tools { display: flex; gap: 6px; }
    .mini-icon-btn {
      width: 38px; height: 38px; border-radius: 12px;
      font-size: 17px; display: flex; align-items: center; justify-content: center;
      cursor: pointer; transition: transform 0.1s, background 0.15s;
    }
    .mini-icon-btn:active { transform: scale(0.9); background: rgba(255,255,255,0.25); }

    /* RADIO PLEYER (FAQAT MASHINADA) */
    #radioBox {
      position: fixed; top: max(116px, calc(env(safe-area-inset-top) + 106px)); left: 50%;
      transform: translateX(-50%);
      display: none; align-items: center; gap: 6px;
      padding: 5px 10px; border-radius: 14px; pointer-events: auto; z-index: 22;
    }
    .radio-title {
      font-size: 11px; max-width: 115px; white-space: nowrap;
      overflow: hidden; text-overflow: ellipsis; color: #b9f6ca;
    }
    .r-btn {
      background: rgba(255,255,255,0.12); color: #fff;
      border: 1px solid rgba(255,255,255,0.25); border-radius: 8px;
      width: 28px; height: 28px; font-size: 12px; cursor: pointer;
    }
    .r-btn:active { background: rgba(255,255,255,0.3); }

    /* MASHINAGA MINISH / TUSHISH TUGMASI */
    #enterExitBtn {
      position: fixed; right: 14px; top: 52%;
      background: rgba(255, 145, 0, 0.42);
      backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
      color: #fff; border: 1.5px solid rgba(255, 255, 255, 0.55);
      padding: 11px 16px; border-radius: 16px;
      font-size: 14px; font-weight: 800; display: none; z-index: 25;
      box-shadow: 0 4px 16px rgba(0,0,0,0.35); cursor: pointer;
    }
    #enterExitBtn:active { transform: scale(0.93); background: rgba(255, 145, 0, 0.72); }

    /* PASTKI BOSHQARUVLAR (SHAFFOF) */
    #footControls, #carControls {
      position: fixed; bottom: max(18px, env(safe-area-inset-bottom));
      left: 14px; right: 14px;
      display: flex; justify-content: space-between; align-items: flex-end;
      pointer-events: none; z-index: 20;
    }
    #carControls { display: none; }

    /* VIRTUAL JOYSTIK */
    #joyZone {
      width: 122px; height: 122px; border-radius: 50%;
      background: rgba(255, 255, 255, 0.08);
      border: 1.5px solid rgba(255, 255, 255, 0.28);
      backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
      position: relative; pointer-events: auto; touch-action: none;
    }
    #joyKnob {
      width: 50px; height: 50px; border-radius: 50%;
      background: rgba(255, 255, 255, 0.42);
      border: 1.5px solid rgba(255, 255, 255, 0.65);
      position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
      pointer-events: none;
    }

    /* PIYODA TUGMALARI */
    .action-cluster {
      display: flex; flex-direction: column; align-items: flex-end; gap: 10px; pointer-events: auto;
    }
    .action-row { display: flex; gap: 10px; align-items: flex-end; }
    .circle-btn {
      width: 56px; height: 56px; border-radius: 50%;
      background: rgba(0, 0, 0, 0.26);
      backdrop-filter: blur(5px); -webkit-backdrop-filter: blur(5px);
      border: 1.5px solid rgba(255, 255, 255, 0.34);
      color: #fff; font-size: 21px; font-weight: bold;
      display: flex; align-items: center; justify-content: center; touch-action: none;
    }
    .circle-btn:active { transform: scale(0.9); background: rgba(255, 255, 255, 0.28); }
    #btnShoot {
      width: 72px; height: 72px; font-size: 26px;
      background: rgba(229, 57, 53, 0.36);
      border-color: rgba(255, 138, 128, 0.65);
    }
    #btnWeapon.armed {
      border-color: rgba(255, 213, 79, 0.9);
      background: rgba(255, 145, 0, 0.38);
    }

    /* MASHINA TUGMALARI (SHAFFOF) */
    .steer-group, .pedal-group {
      display: flex; gap: 10px; pointer-events: auto; align-items: flex-end;
    }
    .steer-btn {
      width: 64px; height: 64px; border-radius: 18px;
      background: rgba(0, 0, 0, 0.26);
      backdrop-filter: blur(5px); -webkit-backdrop-filter: blur(5px);
      border: 1.5px solid rgba(255, 255, 255, 0.32);
      color: #fff; font-size: 24px; font-weight: bold; touch-action: none;
    }
    .steer-btn:active { background: rgba(255, 255, 255, 0.25); transform: scale(0.93); }

    .pedal-btn {
      width: 60px; border-radius: 16px;
      backdrop-filter: blur(5px); -webkit-backdrop-filter: blur(5px);
      color: #fff; font-weight: 800; font-size: 11px; letter-spacing: 0.5px; touch-action: none;
    }
    #btnCarBrake {
      height: 74px;
      background: rgba(211, 47, 47, 0.32);
      border: 1.5px solid rgba(255, 138, 128, 0.55);
    }
    #btnCarGas {
      height: 106px;
      background: rgba(0, 200, 83, 0.32);
      border: 1.5px solid rgba(105, 240, 174, 0.6);
    }
    .pedal-btn:active { transform: scale(0.95); filter: brightness(1.35); }

    /* MASHINA CHAQIRISH (GARAJ) OYNASI */
    #garageModal {
      position: fixed; inset: 0; z-index: 50;
      background: rgba(0, 0, 0, 0.55); backdrop-filter: blur(6px);
      display: none; align-items: center; justify-content: center; padding: 20px;
    }
    .garage-card {
      width: 100%; max-width: 330px; max-height: 72vh;
      border-radius: 20px; padding: 14px;
      display: flex; flex-direction: column; gap: 10px;
    }
    .garage-head {
      display: flex; justify-content: space-between; align-items: center;
      font-weight: 800; font-size: 16px;
    }
    #garageList {
      overflow-y: auto; display: grid; grid-template-columns: 1fr 1fr; gap: 8px;
    }
    .car-item {
      padding: 10px 8px; border-radius: 12px; font-size: 12px; font-weight: 700;
      text-align: center; cursor: pointer;
      background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.22);
      color: #fff;
    }
    .car-item:active { background: rgba(0, 230, 118, 0.35); }
  </style>
</head>
<body>

  <!-- YUKLANISH EKRANI -->
  <div id="loadingScreen">
    <h1>UZBEK MINI GTA</h1>
    <div id="loadingText">Shahar va mashinalar yuklanmoqda...</div>
    <div class="load-bar"><div id="loadFill"></div></div>
  </div>

  <!-- TEPADAGI HUD -->
  <div id="topHUD">
    <div id="radarWrap">
      <canvas id="minimap" width="94" height="94"></canvas>
      <div class="hp-bar"><div class="hp-fill" id="hpFill"></div></div>
    </div>

    <div class="right-top">
      <div class="stats-box glass">
        <div class="money">$<span id="moneyVal">500</span></div>
        <div class="stars" id="starsVal">☆☆☆☆☆</div>
        <div class="speed-mini" id="carSpeedBox"><span id="speedVal">0</span> km/h</div>
      </div>
      <div class="top-tools">
        <button class="mini-icon-btn glass" id="btnOpenGarage" title="Mashina chaqirish">🚗</button>
        <button class="mini-icon-btn glass" id="btnRotateCar" style="display:none;" title="Mashina yuzini to'g'rilash">🔄</button>
      </div>
    </div>
  </div>

  <!-- RADIO PLEYER -->
  <div id="radioBox" class="glass">
    <span>📻</span>
    <div class="radio-title" id="radioTitle">Radio tayyor</div>
    <button class="r-btn" id="rPrev">⏮</button>
    <button class="r-btn" id="rPlay">▶</button>
    <button class="r-btn" id="rNext">⏭</button>
  </div>

  <!-- MASHINAGA MINISH / TUSHISH -->
  <button id="enterExitBtn">🚗 Minish</button>

  <!-- PIYODA BOSHQARUV -->
  <div id="footControls">
    <div id="joyZone"><div id="joyKnob"></div></div>
    <div class="action-cluster">
      <button class="circle-btn" id="btnJump" style="width:48px;height:48px;font-size:18px;">⬆</button>
      <div class="action-row">
        <button class="circle-btn" id="btnWeapon">👊</button>
        <button class="circle-btn" id="btnShoot">🔥</button>
      </div>
    </div>
  </div>

  <!-- MASHINA BOSHQARUV -->
  <div id="carControls">
    <div class="steer-group">
      <button class="steer-btn" id="btnSteerL">◀</button>
      <button class="steer-btn" id="btnSteerR">▶</button>
    </div>
    <div class="pedal-group">
      <button class="circle-btn" id="btnHorn" style="width:48px;height:48px;font-size:18px;">📣</button>
      <button class="pedal-btn" id="btnCarBrake">TORMOZ</button>
      <button class="pedal-btn" id="btnCarGas">GAZ</button>
    </div>
  </div>

  <!-- MASHINA CHAQIRISH MENYUSI -->
  <div id="garageModal">
    <div class="garage-card glass">
      <div class="garage-head">
        <span>🚗 Mashina chaqirish</span>
        <button class="r-btn" id="btnCloseGarage">✕</button>
      </div>
      <div id="garageList"></div>
    </div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
